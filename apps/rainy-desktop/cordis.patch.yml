# RainyAgent: explicit production plugin roster.
- insert:
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'
    - id: hmr
      name: '@deepseek-ai/dsh-hmr'
      config:
        root: []
    - id: llm
      name: '@deepseek-ai/dsh-llm'
    - id: session
      name: '@deepseek-ai/dsh-session'
    - id: typert
      name: '@deepseek-ai/dsh-typert-registry'
    - id: typert-loader
      name: '@deepseek-ai/dsh-typert-loader'
    - id: typert-gateway
      name: '@deepseek-ai/dsh-api-gateway'
    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80
    - id: agent
      name: '@deepseek-ai/dsh-agent'
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: ''
        model: ''
    - id: jobs
      name: '@deepseek-ai/dsh-jobs-local'
    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'
    - id: config-editor
      name: '@deepseek-ai/dsh-config-editor'
    - id: settings
      name: '@deepseek-ai/dsh-settings'
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
    - id: session-persistence-jsonl
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')
        compression: none
    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'
    - id: session-query-sqlite
      name: '@deepseek-ai/dsh-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never
    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'
    - id: storage
      name: '@deepseek-ai/dsh-storage'
    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')
    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json
    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000
    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'
    - id: sandbox
      name: '@deepseek-ai/dsh-sandbox-local'
    - id: sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()
    - id: bash-sandbox
      name: '@deepseek-ai/dsh-rainy-desktop/runtime-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000
    - id: pwsh-sandbox
      name: '@deepseek-ai/dsh-rainy-desktop/runtime-pwsh'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 60000
        pwshPath: !!js process.env.RAINY_PWSH_PATH
    - id: approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: !!js '(process.env.DSH_PERMISSION_MODE ?? ''workspace-write'') === ''danger-full-access'' ? ''never'' : ''ask'''
    - id: permission
      name: '@deepseek-ai/dsh-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never
    - id: shell-env
      name: '@deepseek-ai/dsh-shell-env'
    - id: fs-observation-policy
      name: '@deepseek-ai/dsh-fs-observation-policy'
    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'
    - id: agent-instructions
      name: '@deepseek-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536
        maxSourceBytes: 65536
        budgetOverflow: error
    - id: commands
      name: '@deepseek-ai/dsh-commands'
    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'
    - id: compaction-basic
      name: '@deepseek-ai/dsh-rainy-desktop/compaction'
      config:
        auto: false
        thresholdRatio: 0.7
        headroomTokens: 8000
        retainTokens: 20000
        maxTokens: 4000
        compactionRetries: 0
        maxOverflowRetries: 0
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: timeout-policy
      name: '@deepseek-ai/dsh-tool-call-timeout-policy'
    - id: spill-local
      name: '@deepseek-ai/dsh-spill-local'
    - id: spill-policy
      name: '@deepseek-ai/dsh-spill-policy'
      config: {}
    - id: session-checkpoint-policy
      name: '@deepseek-ai/dsh-session-checkpoint-policy'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
    - id: tools
      name: '@deepseek-ai/dsh-tools'
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: You are RainyAgent, a concise coding assistant. Follow the user and applicable project instructions. Inspect relevant files before editing. Use the available file and shell tools to complete the task. Check command results and report what was actually verified. Keep tool output bounded; use rg and targeted line ranges. Continue from compacted checkpoints without repeating finished work.
        personaSuffix: !!js 'process.platform === "win32" ? "Working directory: {{cwd}}. Commands execute in PowerShell on Windows." : "Working directory: {{cwd}}. Commands execute in Bash on Linux (WSL)."'
    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []
        maxParallelToolCalls: 1
    - id: fs-sandbox
      name: '@deepseek-ai/dsh-fs-sandbox'
    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'
      config:
        enableRunInBackground: false
        promoteOnTimeout: false
    - id: tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'
      config:
        enableRunInBackground: false
        promoteOnTimeout: false
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'
    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'
    - id: session-turn-outline
      name: '@deepseek-ai/dsh-session-turn-outline'
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'
    - id: job-controller
      name: '@deepseek-ai/dsh-api-job-controller'
    - id: terminal-controller
      name: '@deepseek-ai/dsh-api-terminal-controller'
    - id: workspace-files
      name: '@deepseek-ai/dsh-api-workspace-files'
    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'
    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'
    - id: modules
      name: '@deepseek-ai/dsh-client-modules'
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      config:
        trustedHosts: []
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'
    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'
    - id: ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'
    - id: locale
      name: '@deepseek-ai/dsh-client-locale'
      config:
        preference: zh
    - id: shortcuts
      name: '@deepseek-ai/dsh-client-shortcuts'
    - id: ui-shortcuts
      name: '@deepseek-ai/dsh-client-ui-shortcuts'
    - id: ui-layout
      name: '@deepseek-ai/dsh-client-ui-layout'
    - id: ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'
    - id: ui-session
      name: '@deepseek-ai/dsh-client-ui-session'
    - id: resources
      name: '@deepseek-ai/dsh-client-resources'
    - id: ui-sidebar
      name: '@deepseek-ai/dsh-client-ui-sidebar'
    - id: ui-sidebar-right
      name: '@deepseek-ai/dsh-client-ui-sidebar-right'
    - id: ui-sidebar-terminal
      name: '@deepseek-ai/dsh-client-ui-sidebar-terminal'
    - id: ui-sidebar-files
      name: '@deepseek-ai/dsh-client-ui-sidebar-files'
    - id: ui-settings
      name: '@deepseek-ai/dsh-client-ui-settings'
    - id: ui-settings-general
      name: '@deepseek-ai/dsh-client-ui-settings-general'
    - id: ui-conversation
      name: '@deepseek-ai/dsh-client-ui-conversation'
    - id: ui-approval
      name: '@deepseek-ai/dsh-client-ui-approval'
    - id: ui-chat
      name: '@deepseek-ai/dsh-client-ui-chat'
    - id: ui-workspace
      name: '@deepseek-ai/dsh-client-ui-workspace'
    - id: ui-input-trigger
      name: '@deepseek-ai/dsh-client-ui-input-trigger'
    - id: ui-commands
      name: '@deepseek-ai/dsh-client-ui-commands'
    - id: ui-reference
      name: '@deepseek-ai/dsh-client-ui-reference'
    - id: ui-model-selection
      name: '@deepseek-ai/dsh-client-ui-model-selection'
    - id: ui-permission
      name: '@deepseek-ai/dsh-client-ui-permission-presets'
    - id: ui-trajectory
      name: '@deepseek-ai/dsh-client-ui-trajectory'
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: !!js Number(process.env.RAINY_PORT ?? 0)
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: directory-picker-client
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
    - id: pty
      name: '@deepseek-ai/dsh-terminal'
    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        shellDialect: !!js 'process.platform === "win32" ? "pwsh" : "bash"'
        shellPath: !!js process.env.RAINY_PWSH_PATH
    - id: rainy-project-roots
      name: '@deepseek-ai/dsh-rainy-desktop/project-roots'
    - id: rainy-runtime
      name: '@deepseek-ai/dsh-rainy-desktop/runtime'
    - id: rainy-memory
      name: '@deepseek-ai/dsh-rainy-desktop/project-memory'
      config:
        carrierStateRoot: !!js process.env.RAINY_CARRIER_STATE_ROOT
        executionTargetId: !!js process.env.RAINY_EXECUTION_TARGET_ID
        idleMs: 60000
        intervalMs: 600000
        timeoutMs: 30000
        maxInputTokens: 4096
        maxOutputTokens: 512
        maxRecallTokens: 512
        recallRatio: 0.05
    - id: rainy-web
      name: '@deepseek-ai/dsh-rainy-desktop/web'
    - id: rainy-ide
      name: '@deepseek-ai/dsh-rainy-desktop/ide'
    - id: rainy-policy
      name: '@deepseek-ai/dsh-rainy-desktop/policy'
    - id: rainy-ui
      name: '@deepseek-ai/dsh-client-ui-rainy'
    - id: rainy-extensions
      name: '@deepseek-ai/dsh-rainy-desktop/extensions'
